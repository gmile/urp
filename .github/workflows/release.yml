name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]

jobs:
  release:
    runs-on: ubuntu-26.04
    environment: hex
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: nixbuild/nix-quick-install-action@v35

      - env:
          GH_TOKEN: ${{ github.token }}
        run: nix run .#release
