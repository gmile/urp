name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start soffice
        run: |
          docker run -d --name soffice \
            -p 2002:2002 \
            -v /tmp:/tmp \
            libreofficedocker/alpine:3.23 \
            soffice --headless --invisible --nologo \
              --accept="socket,host=0.0.0.0,port=2002,tcpNoDelay=1;urp;" \
              --norestore
          timeout 30 bash -c 'until nc -z localhost 2002; do sleep 1; done'

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: 1.19.5
          otp-version: 28.3

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Restore PLT cache
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-otp${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-plt-otp${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}-
            ${{ runner.os }}-plt-otp${{ steps.beam.outputs.otp-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run tests
        run: mix test

      - name: Run dialyzer
        run: mix dialyzer
